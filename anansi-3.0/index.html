<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANANZI 3.0 — F.A.N.G.S</title>
<meta name="description" content="Ananzi 3.0 — Regional OSINT globe and F.A.N.G.S cyber attack map. System entry point.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060606;
    --red: #c81e1e;
    --red-bright: #ff2b2b;
    --gold: #d4af37;
    --gold-bright: #f4cf5e;
    --line: rgba(212,175,55,0.2);
    --text: #eae7e2;
    --text-dim: #7a7a7a;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --blur: saturate(135%) blur(16px);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; background: var(--bg); }

  body {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow: hidden; position: relative;
  }

  /* drifting gold/red aurora */
  body::after {
    content: ""; position: fixed; inset: -20vmax; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42vmax 42vmax at 20% 12%, rgba(212,175,55,0.16), transparent 60%),
      radial-gradient(46vmax 46vmax at 84% 24%, rgba(200,30,30,0.15), transparent 62%),
      radial-gradient(40vmax 40vmax at 74% 90%, rgba(212,175,55,0.09), transparent 60%);
    filter: blur(14px); animation: drift 32s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(-2vmax,2vmax,0) scale(1.06); }
  }
  /* faint scanlines */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  }

  /* spinning cross-link badge → Spider Sense */
  .crosslink { position: fixed; top: 16px; right: 16px; z-index: 60; width: 66px; height: 66px; display: block; border-radius: 50%; }
  .crosslink img, .crosslink .ring {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    border: 2px solid var(--gold); background: rgba(5,5,5,0.6);
    box-shadow: 0 0 14px rgba(212,175,55,0.35);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    animation: spin 9s linear infinite;
  }
  .crosslink .ring { display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--gold-bright); font-size: 20px; }
  .crosslink:hover img, .crosslink:hover .ring { animation-duration: 2.2s; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .crosslink::after {
    content: "SPIDER SENSE"; position: absolute; top: 50%; right: 78px; transform: translateY(-50%);
    white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.14em;
    color: var(--gold-bright); background: rgba(13,13,13,0.7); border: 1px solid var(--line); border-radius: 8px;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 5px 10px; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .crosslink:hover::after { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 440px) { .crosslink { width: 52px; height: 52px; } }

  /* classification strip */
  .classtop {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: linear-gradient(180deg, rgba(200,30,30,0.82), rgba(150,20,20,0.72));
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    color: #120404; font-family: var(--display); font-weight: 700; font-size: 11px;
    letter-spacing: 0.18em; text-align: center; padding: 7px 0;
    border-bottom: 1px solid rgba(255,120,120,0.35);
  }

  /* the glass console */
  .stage {
    position: relative; z-index: 2; text-align: center;
    width: min(92vw, 460px);
    padding: 40px 38px 34px;
    background: linear-gradient(158deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid rgba(212,175,55,0.24);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .filetag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--text-dim);
    margin: 0 0 18px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  .filetag b { color: var(--gold-bright); font-weight: 500; }

  .logo-wrap { position: relative; width: 150px; height: 150px; margin: 0 auto 26px; }
  .logo-ring {
    position: absolute; inset: -16px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.3); animation: ringSpin 14s linear infinite;
  }
  .logo-ring::before {
    content: ""; position: absolute; top: -2px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
    border-radius: 50%; background: var(--gold-bright); box-shadow: 0 0 8px var(--gold-bright);
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .logo-pulse {
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 44px 8px rgba(200,30,30,0.22); animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  .mark { position: relative; width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }

  .wordmark { font-size: 36px; font-weight: 700; letter-spacing: 0.14em; margin: 0 0 6px; color: var(--text); }
  .wordmark span { color: var(--gold-bright); }
  .verpill {
    display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
    color: var(--gold-bright); border: 1px solid rgba(212,175,55,0.4); border-radius: 6px;
    padding: 3px 10px; margin: 0 0 14px;
  }
  .tagline { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; color: var(--text-dim); margin: 0 0 4px; text-transform: uppercase; }
  .tagline2 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: rgba(212,175,55,0.75); margin: 0 0 26px; }

  .loadbar { width: 220px; height: 2px; background: rgba(255,255,255,0.08); margin: 0 auto 14px; overflow: hidden; position: relative; border-radius: 2px; }
  .loadbar-fill {
    position: absolute; left: -40%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--red-bright), var(--gold-bright), transparent);
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep { 0% { left: -40%; } 100% { left: 100%; } }

  .status { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 30px; }
  .status .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold-bright); box-shadow: 0 0 6px var(--gold-bright); margin-right: 7px;
    animation: pulseGlow 1.6s ease-in-out infinite;
  }

  .enter {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; color: var(--red-bright);
    text-decoration: none; border: 1px solid rgba(212,175,55,0.4); padding: 13px 26px; border-radius: 8px;
    background: rgba(255,255,255,0.03); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    transition: background 0.2s, box-shadow 0.2s, color 0.2s, border-color 0.2s;
  }
  .enter:hover { background: rgba(212,175,55,0.08); box-shadow: 0 0 18px rgba(212,175,55,0.3); color: var(--gold-bright); border-color: rgba(212,175,55,0.6); }
  .enter .arrow { transition: transform 0.2s; }
  .enter:hover .arrow { transform: translateX(4px); }

  .subnav { margin-top: 18px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .subnav a { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-dim); text-decoration: none; }
  .subnav a:hover { color: var(--gold-bright); }

  @media (prefers-reduced-motion: reduce) {
    .crosslink img, .crosslink .ring, .logo-ring, .logo-pulse, .loadbar-fill, .status .dot, body::after { animation: none; }
  }
</style>
</head>
<body>

  <h1 class="wordmark">ANAN<span>ZI</span></h1>

  <div class="subnav">

  </div>
</div>

</body>
</html>
