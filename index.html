<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANANSI</title>
<meta name="description" content="Anansi — Real-Time Regional Intelligence Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060606;
    --red: #c81e1e;
    --red-bright: #ff2b2b;
    --gold: #d4af37;
    --gold-bright: #f4cf5e;
    --line: rgba(200,30,30,0.25);
    --text: #eae7e2;
    --text-dim: #7a7a7a;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .stage {
    position: relative;
    text-align: center;
    padding: 40px;
  }

  .logo-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 34px;
  }

  .logo-ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.3);
    animation: ringSpin 14s linear infinite;
  }
  .logo-ring::before {
    content: "";
    position: absolute;
    top: -2px;
    left: 50%;
    width: 5px;
    height: 5px;
    margin-left: -2.5px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 8px var(--gold-bright);
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }

  .logo-pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 40px 6px rgba(200,30,30,0.18);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  svg.mark { position: relative; width: 100%; height: 100%; }

  .wordmark {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.14em;
    margin: 0 0 10px;
    color: var(--text);
  }
  .wordmark span { color: var(--gold-bright); }

  .tagline {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 30px;
    text-transform: uppercase;
  }

  .loadbar {
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    margin: 0 auto 14px;
    overflow: hidden;
    position: relative;
  }
  .loadbar-fill {
    position: absolute;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--red-bright), var(--gold-bright), transparent);
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  .status {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 36px;
  }
  .status .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 6px var(--gold-bright);
    margin-right: 7px;
    animation: pulseGlow 1.6s ease-in-out infinite;
  }

  .enter {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--red-bright);
    text-decoration: none;
    border: 1px solid rgba(212,175,55,0.35);
    padding: 13px 26px;
    border-radius: 2px;
    transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .enter:hover {
    background: rgba(212,175,55,0.06);
    box-shadow: 0 0 18px rgba(212,175,55,0.3);
    color: var(--gold-bright);
    border-color: rgba(212,175,55,0.6);
  }
  .enter .arrow { transition: transform 0.2s ease; }
  .enter:hover .arrow { transform: translateX(4px); }

  @media (prefers-reduced-motion: reduce) {
    .logo-ring, .logo-pulse, .loadbar-fill, .status .dot { animation: none; }
  }
</style>
</head>
